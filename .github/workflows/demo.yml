name: demo

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABUNKER_URL: http://localhost:3000
      DATABUNKER_TOKEN: DEMO
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Start Databunker Pro (demo mode)
        run: |
          docker run -d -p 3000:3000 --name databunkerpro securitybunker/databunkerpro:latest demo
          for i in $(seq 1 60); do
            curl -s -X POST "$DATABUNKER_URL/v2/UserGet" -H "X-Bunker-Token: DEMO" \
              -H "Content-Type: application/json" -d '{"mode":"login","identity":"ready"}' | grep -q status && exit 0
            sleep 1
          done
          docker logs databunkerpro
          exit 1

      - name: Cache newmean-pii models
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/newmean-pii
          key: newmean-pii-models-${{ hashFiles('python/pyproject.toml') }}

      - name: Install
        run: pip install -e "python[test,example]"

      - name: Tests
        working-directory: python
        run: pytest -q

      - name: Pipeline demo
        working-directory: python
        run: |
          python examples/pipeline.py | tee pipeline.txt
          {
            echo '### Pipeline demo (fake LLM)'
            echo '```text'
            cat pipeline.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
